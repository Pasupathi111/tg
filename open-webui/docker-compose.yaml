services:
  tg:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg:${TG_DOCKER_TAG-latest}
    container_name: tg
    volumes:
      - tg-data:/app/backend/data
    ports:
      - ${TG_PORT-3000}:8080
    environment:
      - 'ENABLE_OLLAMA_API=false'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in the environment or a .env file}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  tg-data: {}
